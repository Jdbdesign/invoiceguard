name: Check production migrations

# Runs on every PR into master, which is what actually blocks a bad
# merge/deploy (gated via the required status check in branch protection).
# Also runs on push to master: branch protection's required check only
# blocks merges, not direct pushes, so a push-triggered run can't stop a
# bad direct push before Vercel's git integration deploys it — but it
# still surfaces a migration gap immediately instead of silently.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check-prod-migrations:
    runs-on: ubuntu-latest
    # Set at job level, not just on the final step: `npm ci` runs the
    # `postinstall` hook (`prisma generate`), and prisma.config.ts resolves
    # DATABASE_URL at config-load time, so it must already be set before
    # `npm ci` runs, not just before the check script itself.
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run db:check-prod-migrations
